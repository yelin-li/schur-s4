<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#37474f"/>
    </marker>
    <style>
      .box   { fill:#f7f9fb; stroke:#90a4ae; stroke-width:1.6; rx:10; }
      .tool  { fill:#e8f5e9; stroke:#66a37a; stroke-width:1.6; rx:10; }
      .lean  { fill:#e7f0fb; stroke:#5b8dd6; stroke-width:1.6; rx:10; }
      .data  { fill:#fff8e1; stroke:#c9a227; stroke-width:1.6; rx:10; }
      .t     { font-size:16px; fill:#1b2a33; }
      .ts    { font-size:13px; fill:#4b5b66; }
      .h     { font-size:20px; font-weight:600; fill:#1b2a33; }
      .lbl   { font-size:13px; fill:#37474f; }
      .edge  { stroke:#37474f; stroke-width:1.7; fill:none; marker-end:url(#arrow); }
      .code  { font-family:Consolas, monospace; font-size:12.5px; fill:#33434d; }
    </style>
  </defs>

  <text class="h" x="30" y="38">Certificate pipeline: a solver written for this repository, checked by a proved Lean checker</text>
  <text class="ts" x="30" y="60">No external SAT solver is used, and nothing about the solver is trusted: every derivation step is re-checked.</text>

  <!-- row 1: the front end -->
  <rect class="box"  x="30"  y="90" width="200" height="86"/>
  <text class="t"    x="46"  y="120">Schur CNF</text>
  <text class="ts"   x="46"  y="142">180 vars, 2341 clauses</text>
  <text class="ts"   x="46"  y="162">(S(4): {1..45}, 4 colours)</text>

  <rect class="tool" x="280" y="90" width="230" height="86"/>
  <text class="t"    x="296" y="120">CDCL solver (from scratch)</text>
  <text class="ts"   x="296" y="142">watched literals, 1UIP learning,</text>
  <text class="ts"   x="296" y="162">VSIDS, Luby restarts, deletion</text>

  <rect class="data" x="560" y="90" width="200" height="86"/>
  <text class="t"    x="576" y="120">RUP certificate</text>
  <text class="ts"   x="576" y="142">clause + hint list per step</text>
  <text class="ts"   x="576" y="162">S(4): 214 490 steps</text>

  <rect class="tool" x="800" y="90" width="150" height="86"/>
  <text class="t"    x="816" y="120">trim + expand</text>
  <text class="ts"   x="816" y="142">backwards marking;</text>
  <text class="ts"   x="816" y="162">RUP → resolution</text>

  <path class="edge" d="M230,133 H276"/>
  <path class="edge" d="M510,133 H556"/>
  <path class="edge" d="M760,133 H796"/>

  <!-- row 2: the independent Python checks -->
  <rect class="box" x="280" y="220" width="230" height="78"/>
  <text class="t"   x="296" y="248">verify_rup.py</text>
  <text class="ts"  x="296" y="270">independent RUP checker</text>
  <text class="ts"  x="296" y="288" font-weight="600" fill="#2e7d32">S(4): OK, 214 490 steps</text>

  <rect class="box" x="800" y="220" width="150" height="78"/>
  <text class="t"   x="816" y="248">independent</text>
  <text class="t"   x="816" y="268">step check</text>
  <text class="ts"  x="816" y="288" font-weight="600" fill="#2e7d32">OK</text>

  <path class="edge" d="M395,176 V216"/>
  <path class="edge" d="M875,176 V216"/>

  <!-- row 3: Lean -->
  <rect class="lean" x="280" y="340" width="230" height="96"/>
  <text class="t"   x="296" y="368">Resolution.lean</text>
  <text class="ts"  x="296" y="390">proved checker (no sorry):</text>
  <text class="code" x="296" y="410">checkProof_sound :</text>
  <text class="code" x="296" y="428">checkProof c = true → base UNSAT</text>

  <rect class="data" x="560" y="340" width="200" height="96"/>
  <text class="t"   x="576" y="368">CertificateS3.lean</text>
  <text class="ts"  x="576" y="390">generated data:</text>
  <text class="ts"  x="576" y="410">203 base clauses,</text>
  <text class="ts"  x="576" y="428">1355 resolution steps</text>

  <rect class="lean" x="800" y="340" width="150" height="96"/>
  <text class="t"   x="816" y="368">Encoding.lean</text>
  <text class="ts"  x="816" y="390">CNF ⟺ colouring,</text>
  <text class="ts"  x="816" y="410">proved by families</text>
  <text class="ts"  x="816" y="428">(ALO / AMO / triples)</text>

  <path class="edge" d="M395,298 V336"/>
  <path class="edge" d="M660,436 V470"/>
  <path class="edge" d="M660,340 V300 H800 V336" stroke-dasharray="5,4"/>

  <!-- row 4: the theorems -->
  <rect class="lean" x="430" y="470" width="470" height="118"/>
  <text class="t"   x="446" y="498">What is proved</text>
  <text class="code" x="446" y="522">cert3_unsat : ¬ ∃ a, ∀ c ∈ base3, Sat a c</text>
  <text class="code" x="446" y="544">forcing_three_certified : Schur.Forcing 3 14</text>
  <text class="ts"   x="446" y="568">trust base: propext, Quot.sound, and two native_decide evaluations</text>
  <text class="ts"   x="446" y="584">of the checker and of the CNF agreement — not of any search.</text>

  <!-- side note -->
  <rect class="data" x="30" y="340" width="220" height="248"/>
  <text class="t"   x="46" y="368">Status of the S(4) instance</text>
  <text class="ts"  x="46" y="394">Refuted in 214 490 conflicts</text>
  <text class="ts"  x="46" y="412">(≈ 12 s), certificate verified</text>
  <text class="ts"  x="46" y="430">by two independent checkers.</text>
  <text class="ts"  x="46" y="458">Lean check of that certificate:</text>
  <text class="ts"  x="46" y="476">4 584 737 hints → ≈ 4.6 M</text>
  <text class="ts"  x="46" y="494">resolution steps, ≈ 400 MB of</text>
  <text class="ts"  x="46" y="512">generated data, hours of checking.</text>
  <text class="ts"  x="46" y="540" font-weight="600">So: the machinery is proved and</text>
  <text class="ts"  x="46" y="558" font-weight="600">demonstrated on S(3); the S(4)</text>
  <text class="ts"  x="46" y="576" font-weight="600">trust base is unchanged.</text>
</svg>
