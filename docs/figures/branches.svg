<svg xmlns='http://www.w3.org/2000/svg' width='900' height='320' viewBox='0 0 900 320' role='img' aria-label='the three verified branches'>
<rect width='900' height='320' fill='#ffffff'/>
<text x='30' y='30' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2933' text-anchor='start' font-weight='600' >The exhaustive search is split into three disjoint branches</text>
<text x='30' y='46' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#7b8794' text-anchor='start' font-weight='normal' >each branch is a separate Lean file verified by native_decide; the verdicts are combined by a proved lemma</text>
<rect x='210' y='70' width='216.5758275395523' height='34' fill='#2b6cb0' stroke='none' stroke-width='1' rx='3'/>
<text x='198' y='91.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal' >third integer = 0</text>
<text x='434.5758275395523' y='91.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='600' >47,033,043 nodes   (BranchB0 588s)</text>
<rect x='210' y='124' width='440.0' height='34' fill='#2b6cb0' stroke='none' stroke-width='1' rx='3'/>
<text x='198' y='145.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal' >third integer = 1</text>
<text x='658.0' y='145.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='600' >95,553,318 nodes   (BranchB1 1183s)</text>
<rect x='210' y='178' width='360.4281069549045' height='34' fill='#2b6cb0' stroke='none' stroke-width='1' rx='3'/>
<text x='198' y='199.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='end' font-weight='normal' >third integer = 2</text>
<text x='578.4281069549045' y='199.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='600' >78,272,958 nodes   (BranchB2 959s)</text>
<text x='198' y='240' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='end' font-weight='600' >total</text>
<text x='218' y='240' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#276749' text-anchor='start' font-weight='600' >220,859,319 nodes  =  220 859 322 states (minus the 3 prefix states)</text>
</svg>
