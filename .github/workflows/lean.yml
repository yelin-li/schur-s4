name: lean

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast job: the kernel-checked part of the development (definitions, the
  # search specifications and both symmetry reductions).
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: Schur Symmetry RuleB

  # Full job: additionally runs the three exhaustive branches (each a closed
  # native_decide) and assembles S(4) = 44, then prints the trust base.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: S4 Verify

  # Certificate path: the proved checker, the generated S(3) certificate, and
  # the encoding lemma that turns it into `Schur.Forcing 3 14`.  Fast (seconds);
  # the S(4) certificate itself is regenerated by the bench scripts instead of
  # being committed (see docs/CERTIFICATES.md).
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: Resolution CertCheckS3 Encoding
